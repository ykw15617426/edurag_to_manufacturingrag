# MySQL 配置
[mysql]
host = localhost
port = 3307
user = root
password = 
database = subjects_kg

# Redis 配置
[redis]
host = localhost
port = 6379
password = 
db = 0

# Milvus 配置
[milvus]
host = localhost
port = 19530
# 数据库需要自己创建
database_name = itcast07
collection_name = edurag
# Storage Schema v1，只有显式 manufacturing 模式使用；不是业务文档版本。
manufacturing_collection_name = manufacturing_rag_v1

[ingestion]
# 单 worker 控制面；runtime 必须持久化，不提交 SQLite 文件。
manufacturing_manifest_db_path = runtime/manufacturing_manifest.sqlite3

# 日志配置
[logger]
log_file = ./edu_rag/logs/app.log

# LLM 配置
[llm]
model = qwen3.8-max
dashscope_api_key = 
dashscope_base_url = https://dashscope.aliyuncs.com/compatible-mode/v1

# 检索参数配置
[retrieval]
parent_chunk_size = 512
parent_chunk_overlap = 120
child_chunk_size = 128
child_chunk_overlap = 30
retrieval_k = 5
candidate_m = 2

# 应用配置
[app]
valid_sources = ["ai", "java", "test", "ops", "bigdata"]
customer_service_phone = 13000000000

# Manufacturing runtime bounds, not Stage 12 tuning results.
[manufacturing]
llm_timeout_seconds = 30
redis_timeout_seconds = 2
cache_ttl_seconds = 300
fast_path_snapshot_path =
cors_origins = []
